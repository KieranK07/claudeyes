[project]
name = "claudeyes"
version = "0.1.0"
description = "Perception for an agent that can tell what it did from what happened to it."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
claudeyes = "claudeyes.daemon:main"

[tool.setuptools.packages.find]
include = ["claudeyes*"]
